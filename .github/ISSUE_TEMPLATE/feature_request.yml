name: Feature request
description: Suggest a new runner, ecosystem, option, or workflow improvement.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user friction should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, command mapping, or detection rule.
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: Detection signals
      description: List manifest files, lockfiles, config fields, or commands that identify this ecosystem.
      placeholder: |
        manifest: example.toml
        lockfile: example.lock
        command: example test
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: examples
    attributes:
      label: Example projects or docs
      description: Link public examples if available.
