name: Bug report
description: Report incorrect detection, execution, install, or update behavior.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction so maintainers can verify the runner decision.
  - type: input
    id: version
    attributes:
      label: devrunner version
      description: Output of `devrunner --version`.
      placeholder: devrunner 0.6.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: Paste the exact command and relevant output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Minimal project layout
      description: List relevant manifests, lockfiles, config files, and directory nesting.
      placeholder: |
        package.json
        pnpm-lock.yaml
        devrunner.toml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
